[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overshoulder"
version = "0.1.0.dev0"
description = "Your agent works in its window. Your desk stays yours. An MCP server that lets AI agents see, operate and record Windows apps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "mss>=10",
  "pillow>=10",
  "mcp>=2.3,<3",
  # Windows.Media.Ocr, for finding text in apps that paint their own controls (driver/ocr.py).
  "winrt-runtime==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Globalization==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]

[project.scripts]
overshoulder = "overshoulder.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/overshoulder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "desktop: needs an interactive Windows desktop session (skipped in CI unless OVERSHOULDER_DESKTOP_TESTS=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/overshoulder/settings_page.py" = ["E501"]  # HTML/CSS template lines
