name: release

# Builds the sdist and wheel and publishes them with PyPI Trusted Publishing: PyPI trusts this workflow
# by name, so no API token is stored anywhere. A version tag (v0.1.0) publishes to PyPI; running the
# workflow by hand publishes to TestPyPI. Each index must list this repository, `release.yml` and the
# environment below as a trusted publisher first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: The tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} does not match version {version}"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel installs and its tests pass
        run: |
          python -m venv C:\wheel-test
          C:\wheel-test\Scripts\python -m pip install (Get-ChildItem dist\*.whl).FullName pytest
          C:\wheel-test\Scripts\python -m pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/overshoulder
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/overshoulder
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
